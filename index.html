<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gall.y</title>
<style>
  :root{
    --bg:#0f0f14;
    --panel:#16161f;
    --panel2:#1c1c28;
    --border:#28283a;
    --text:#e7e7ee;
    --dim:#8b8b9e;
    --accent:#818cf8;
    --accent-dim:#4f46e5;
    --active:#242440;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --sidebar-w:280px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;}
  body{display:flex; min-height:100vh;}
  body.modal-open{overflow:hidden; height:100vh;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    height:100vh; position:fixed; top:0; left:0; z-index:20;
  }
  .sb-header{
    padding:16px 16px 12px;
    border-bottom:1px solid var(--border);
  }
  .sb-title{
    font-size:16px; font-weight:700; letter-spacing:0.01em; margin:0 0 12px;
  }
  .sb-title span{color:var(--accent);}

  #sb-search{
    width:100%;
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:9px 12px; border-radius:6px; font-size:13px; font-family:var(--mono);
  }
  #sb-search:focus{outline:1px solid var(--accent); border-color:var(--accent);}
  #sb-search::placeholder{color:var(--dim);}

  #tree{
    flex:1; overflow-y:auto; padding:8px;
  }
  #tree::-webkit-scrollbar{width:8px;}
  #tree::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

  .tdivider{
    height:1px; background:var(--border); margin:10px 8px;
  }
  .tsection-label{
    font-size:10px; text-transform:uppercase; letter-spacing:0.07em; color:var(--dim);
    padding:8px 10px 4px;
    font-weight:600;
  }

  .tnode{ user-select:none; }
  .trow{
    display:flex; align-items:center; gap:6px;
    padding:7px 8px; border-radius:6px;
    font-size:13.5px; color:var(--text);
    white-space:nowrap;
  }
  .trow:hover{background:var(--panel2);}
  .trow.selected{background:var(--active); font-weight:600; color:var(--accent);}

  .chev-btn{
    width:18px; height:18px; flex:0 0 18px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; color:var(--dim); cursor:pointer;
    padding:0; border-radius:4px;
  }
  .chev-btn:hover{background:var(--border); color:var(--text);}
  .chev-btn svg{transition:transform 0.12s ease;}
  .trow.open .chev-btn svg{transform:rotate(90deg);}
  .chev-spacer{width:18px; flex:0 0 18px;}

  .row-main{
    display:flex; align-items:center; gap:7px; flex:1; min-width:0; cursor:pointer;
    padding:1px 0;
  }
  .folder-icon{flex:0 0 auto; color:var(--dim); opacity:0.75; display:flex;}
  .trow.selected .folder-icon{color:var(--accent); opacity:1;}
  .star-icon{flex:0 0 auto; color:var(--accent); font-size:12px;}
  .all-icon{flex:0 0 auto; width:6px; height:6px; border-radius:1px; background:var(--dim);}

  .label{overflow:hidden; text-overflow:ellipsis;}
  .count{
    margin-left:auto; color:var(--dim); font-size:11px; font-family:var(--mono);
    flex:0 0 auto; padding-left:8px;
  }
  .children{
    margin-left:20px; border-left:1px solid var(--border); padding-left:4px;
    display:none;
  }
  .children.open{display:block;}

  .sb-footer{
    padding:10px 14px; border-top:1px solid var(--border);
    font-size:10.5px; color:var(--dim); font-family:var(--mono); line-height:1.5;
  }
  .sb-footer a{color:var(--dim);}

  /* mobile toggle */
  #sb-toggle{
    display:none;
    position:fixed; bottom:18px; right:18px; z-index:50;
    background:var(--accent); color:#14142080; border:none;
    color:#0f0f14;
    width:50px; height:50px; border-radius:50%;
    font-size:20px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
    align-items:center; justify-content:center;
  }
  #sb-overlay{
    display:none;
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:39;
  }

  /* ---------- Main content ---------- */
  #content{margin-left:var(--sidebar-w); min-width:0; display:flex; flex-direction:column; width:calc(100% - var(--sidebar-w));}

  #topbar{
    position:sticky; top:0; z-index:10;
    background:rgba(15,15,20,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:14px 22px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  #crumb{
    font-size:13px; font-family:var(--mono); color:var(--dim); flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #crumb b{color:var(--text); font-weight:600;}
  #status{font-size:12px; color:var(--dim); font-family:var(--mono); white-space:nowrap;}

  .topbar-btn{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:7px 10px; border-radius:6px; font-size:12px; font-family:var(--mono);
    cursor:pointer;
  }
  .topbar-btn:hover{border-color:var(--accent); color:var(--accent);}
  .topbar-btn.active{background:var(--active); border-color:var(--accent); color:var(--accent);}

  #download-bar{
    display:none;
    align-items:center; gap:10px;
    background:var(--panel2); border:1px solid var(--accent-dim);
    border-radius:10px; padding:10px 14px;
    font-family:var(--mono); font-size:12.5px; flex-wrap:wrap;
    position:fixed; bottom:22px; left:calc(var(--sidebar-w) + 22px); right:22px;
    z-index:45; box-shadow:0 8px 28px rgba(0,0,0,0.5);
    max-width:640px;
  }
  #download-bar.active{display:flex;}
  #download-bar .bar-actions{display:flex; gap:10px; align-items:center;}
  #download-bar .sel-count{color:var(--text); font-weight:600;}
  #download-bar button{
    background:var(--accent-dim); border:none; color:#fff;
    padding:7px 14px; border-radius:6px; font-size:12px; font-family:var(--mono);
    cursor:pointer;
  }
  #download-bar button:hover{background:var(--accent);}
  #download-bar button.secondary{
    background:none; border:1px solid var(--border); color:var(--dim);
  }
  #download-bar button.secondary:hover{color:var(--text); border-color:var(--dim);}

  .cell{position:relative;}
  .cell .select-check{
    position:absolute; top:6px; left:6px; z-index:2;
    width:20px; height:20px; border-radius:5px;
    background:rgba(0,0,0,0.55); border:1.5px solid rgba(255,255,255,0.5);
    display:none; align-items:center; justify-content:center;
    color:#fff; font-size:12px;
  }
  body.select-mode .cell .select-check{display:flex;}
  .cell.selected .select-check{background:var(--accent-dim); border-color:var(--accent);}
  .cell.selected{border-color:var(--accent);}

  main{padding:18px 22px 60px; flex:1;}

  #loadbar{
    height:2px; background:var(--border); position:relative; overflow:hidden; margin-bottom:16px; border-radius:2px;
    display:none;
  }
  #loadbar.active{display:block;}
  #loadbar .fill{
    position:absolute; left:0; top:0; height:100%; width:30%;
    background:var(--accent);
    animation:slide 1.1s ease-in-out infinite;
  }
  @keyframes slide{ 0%{left:-30%;} 100%{left:100%;} }

  #error-box{
    display:none;
    text-align:center; padding:50px 20px; color:var(--dim);
  }
  #error-box.active{display:block;}
  #error-box .msg{font-size:14px; margin-bottom:16px; font-family:var(--mono);}
  #retry-btn{
    background:var(--panel); border:1px solid var(--accent); color:var(--accent);
    padding:9px 20px; border-radius:6px; font-size:13px; font-family:var(--mono);
    cursor:pointer;
  }
  #retry-btn:hover{background:var(--accent); color:#0f0f14;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:10px;
  }

  .cell{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
    cursor:pointer;
    display:flex; flex-direction:column;
    transition:border-color 0.15s ease;
  }
  .cell:hover{border-color:var(--accent);}

  .thumb-wrap{
    aspect-ratio:1/1;
    background:
      linear-gradient(45deg, #1c1c28 25%, transparent 25%),
      linear-gradient(-45deg, #1c1c28 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1c1c28 75%),
      linear-gradient(-45deg, transparent 75%, #1c1c28 75%);
    background-size:16px 16px;
    background-position:0 0, 0 8px, 8px -8px, -8px 0px;
    background-color:#131319;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .thumb-wrap img, .thumb-wrap video{
    width:100%; height:100%; object-fit:contain;
    opacity:0; transition:opacity 0.2s ease;
  }
  .thumb-wrap img.loaded, .thumb-wrap video.loaded{opacity:1;}
  .thumb-wrap .play-badge{
    position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,0.65);
    color:#fff; font-size:10px; padding:3px 6px; border-radius:4px; font-family:var(--mono);
    pointer-events:none;
  }

  .cell .name{
    font-size:10.5px; font-family:var(--mono); color:var(--dim);
    padding:6px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    border-top:1px solid var(--border);
  }

  #sentinel{height:1px;}
  #empty{ text-align:center; color:var(--dim); padding:60px 20px; font-size:14px; }

  /* Lightbox */
  #lightbox{
    position:fixed; inset:0; background:rgba(8,8,11,0.96);
    display:none; align-items:center; justify-content:center; z-index:100;
    flex-direction:column; padding:30px;
    overflow-y:auto;
  }
  #lightbox.open{display:flex;}
  #lightbox img, #lightbox video{ max-width:92vw; max-height:70vh; object-fit:contain; border:1px solid var(--border); }
  #lightbox .lb-meta{
    color:var(--dim); font-family:var(--mono); font-size:12px; margin-top:14px; text-align:center; max-width:80vw; word-break:break-all;
  }
  #lightbox .lb-info{
    display:flex; gap:18px; margin-top:10px; font-family:var(--mono); font-size:11.5px; color:var(--dim);
    flex-wrap:wrap; justify-content:center;
  }
  #lightbox .lb-info b{color:var(--text); font-weight:600;}
  #lightbox .lb-actions{margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  #lightbox .lb-actions a, #lightbox .lb-actions button{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:7px 14px; border-radius:6px; font-size:12px; font-family:var(--mono);
    text-decoration:none; cursor:pointer;
  }
  #lightbox .lb-actions a:hover, #lightbox .lb-actions button:hover{border-color:var(--accent); color:var(--accent);}
  #lb-close{
    position:fixed; top:18px; right:22px; background:none; border:none;
    color:var(--dim); font-size:26px; cursor:pointer; line-height:1; z-index:101;
  }
  #lb-close:hover{color:var(--text);}

  /* ---------- Custom confirm modal ---------- */
  #confirm-modal{
    display:none;
    position:fixed; inset:0; background:rgba(8,8,11,0.72); z-index:200;
    align-items:center; justify-content:center; padding:20px;
  }
  #confirm-modal.open{display:flex;}
  .confirm-box{
    background:var(--panel2); border:1px solid var(--border);
    border-radius:12px; padding:22px; max-width:380px; width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,0.5);
  }
  .confirm-title{font-size:15px; font-weight:700; margin-bottom:8px;}
  .confirm-msg{font-size:13px; color:var(--dim); line-height:1.5; margin-bottom:18px; font-family:var(--mono);}
  .confirm-actions{display:flex; gap:10px; justify-content:flex-end;}
  .confirm-actions button{
    padding:8px 16px; border-radius:6px; font-size:13px; font-family:var(--mono);
    cursor:pointer; border:1px solid var(--border); background:var(--accent-dim); color:#fff;
  }
  .confirm-actions button:hover{background:var(--accent);}
  .confirm-actions button.secondary{background:none; color:var(--dim);}
  .confirm-actions button.secondary:hover{color:var(--text); border-color:var(--dim); background:none;}

  /* ---------- Mobile ---------- */
  @media (max-width: 860px){
    #sidebar{
      position:fixed; left:0; top:0; z-index:40;
      transform:translateX(-100%);
      transition:transform 0.2s ease;
      width:82vw; max-width:320px;
      box-shadow:8px 0 24px rgba(0,0,0,0.4);
    }
    #sidebar.open{transform:translateX(0);}
    #sb-overlay.open{display:block;}
    #sb-toggle{display:flex;}

    #content{margin-left:0; width:100%;}

    #download-bar{
      left:0; right:0; bottom:0;
      border-radius:0; border-left:none; border-right:none; border-bottom:none;
      max-width:none;
      padding:10px 12px;
      padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));
      flex-wrap:nowrap;
      justify-content:space-between;
      gap:8px;
    }
    #download-bar .sel-count{
      flex:0 0 auto; font-size:11.5px; white-space:nowrap;
    }
    #download-bar .bar-actions{
      display:flex; gap:6px; flex:1; min-width:0; justify-content:flex-end;
    }
    #download-bar button{
      padding:8px 10px; font-size:11.5px; white-space:nowrap;
    }
    #download-bar button#download-selected-btn{
      flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
    }
    #sb-toggle{ bottom:18px; }
    body.select-mode #sb-toggle{ display:none; }

    #topbar{padding:10px 12px;}
    #crumb{font-size:12px;}
    main{padding:12px 10px 90px;}

    .grid{
      grid-template-columns:repeat(auto-fill, minmax(104px, 1fr));
      gap:7px;
    }
    .cell .name{font-size:9.5px; padding:5px 6px;}

    #lightbox{padding:14px;}
    #lightbox img, #lightbox video{max-height:56vh;}
    #lb-close{top:10px; right:14px; font-size:30px;}
    .lb-actions{flex-wrap:wrap; justify-content:center;}
    .lb-actions a, .lb-actions button{padding:9px 14px; font-size:13px;}

    #sb-search{font-size:16px;}
  }

  @media (hover: none){
    .cell:active{border-color:var(--accent);}
  }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<div id="sb-overlay"></div>

<aside id="sidebar">
  <div class="sb-header">
    <div class="sb-title">Gall<span>.</span>y</div>
    <input id="sb-search" type="text" placeholder="Search files…">
  </div>
  <div id="tree"></div>
  <div class="sb-footer">
    Source: <a href="https://github.com/myssal/Reverse-1999-CN-Asset" target="_blank" rel="noopener">myssal/Reverse-1999-CN-Asset</a><br>
    Files served live, not hosted here.
  </div>
</aside>

<button id="sb-toggle" aria-label="Toggle folders">☰</button>

<div id="content">
  <div id="topbar">
    <div id="crumb">Loading…</div>
    <button id="download-folder-btn" class="topbar-btn">Download folder (.zip)</button>
    <button id="select-toggle" class="topbar-btn">Select</button>
    <span id="status"></span>
  </div>
  <main>
    <div id="loadbar" class="active"><div class="fill"></div></div>
    <div id="error-box">
      <div class="msg" id="error-msg">Failed to load file list.</div>
      <button id="retry-btn">Retry</button>
    </div>
    <div id="download-bar">
      <span class="sel-count"><span id="sel-count-num">0</span> selected</span>
      <div class="bar-actions">
        <button id="download-selected-btn">Download as .zip</button>
        <button class="secondary" id="clear-selection-btn">Clear</button>
      </div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" style="display:none;">No files match.</div>
    <div id="sentinel"></div>
  </main>
</div>

<div id="lightbox">
  <button id="lb-close">&times;</button>
  <div id="lb-media"></div>
  <div class="lb-meta" id="lb-path"></div>
  <div class="lb-info" id="lb-info">
    <span>size: <b id="lb-size">…</b></span>
    <span>dimensions: <b id="lb-dims">…</b></span>
    <span>added/modified: <b id="lb-date">…</b></span>
  </div>
  <div class="lb-actions">
    <button id="lb-download">Download</button>
    <a id="lb-open" href="#" target="_blank" rel="noopener">Open raw</a>
    <a id="lb-github" href="#" target="_blank" rel="noopener">View on GitHub</a>
    <button id="lb-copy">Copy path</button>
  </div>
</div>

<div id="confirm-modal">
  <div class="confirm-box">
    <div class="confirm-title" id="confirm-title">Confirm</div>
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-actions">
      <button id="confirm-cancel" class="secondary">Cancel</button>
      <button id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<script>
const OWNER = "myssal";
const REPO = "Reverse-1999-CN-Asset";
const BRANCH = "master";
const VIDEO_EXT = /\.(mp4|webm|mov|m4v|avi|mkv)$/i;
const MEDIA_EXT = /\.(png|jpe?g|webp|gif|mp4|webm|mov|m4v|avi|mkv)$/i;
const ALLOWED_PREFIXES = ['singlebg/', 'live2d/roles/', 'atlassrc/', 'singlebg_lang/', 'video/'];
const PINNED_PATHS = ['singlebg/headicon_img', 'singlebg/headicon_middle'];

const RAW_BASE = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const BLOB_BASE = `https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/`;
const TREE_API = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
const COMMITS_API = (path) => `https://api.github.com/repos/${OWNER}/${REPO}/commits?path=${encodeURIComponent(path)}&per_page=1`;
const CONTENTS_API = (path) => `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path.split('/').map(encodeURIComponent).join('/')}?ref=${BRANCH}`;

const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const crumbEl = document.getElementById('crumb');
const sbSearch = document.getElementById('sb-search');
const treeEl = document.getElementById('tree');
const loadbar = document.getElementById('loadbar');
const errorBox = document.getElementById('error-box');
const errorMsg = document.getElementById('error-msg');
const retryBtn = document.getElementById('retry-btn');
const emptyEl = document.getElementById('empty');
const sentinel = document.getElementById('sentinel');
const sidebar = document.getElementById('sidebar');
const sbToggle = document.getElementById('sb-toggle');
const sbOverlay = document.getElementById('sb-overlay');
const selectToggle = document.getElementById('select-toggle');
const downloadBar = document.getElementById('download-bar');
const selCountNum = document.getElementById('sel-count-num');
const downloadSelectedBtn = document.getElementById('download-selected-btn');
const clearSelectionBtn = document.getElementById('clear-selection-btn');
const downloadFolderBtn = document.getElementById('download-folder-btn');

const FOLDER_SVG = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M2.5 5.5C2.5 4.67 3.17 4 4 4h4.5l1.8 2H16c.83 0 1.5.67 1.5 1.5v7c0 .83-.67 1.5-1.5 1.5H4c-.83 0-1.5-.67-1.5-1.5v-9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';

let allImages = [];      // { path, name, folder, isVideo }
let folderTree = {};     // nested { name, path, count, children:{} }
let selectedFolder = ""; // "" = everything in scope; "__pinned__" = favorites
let searchQuery = "";
let filtered = [];
let renderedCount = 0;
const BATCH = 60;
const openFolders = new Set(); // persists expand state across re-renders
let selectMode = false;
const selectedPaths = new Set();
const dateCache = new Map(); // path -> ISO date string (or null if fetched-and-missing)
let rootFolderNames = []; // diagnostics: actual top-level folder names seen in the tree

async function init(){
  loadbar.classList.add('active');
  errorBox.classList.remove('active');
  grid.innerHTML = '';
  emptyEl.style.display = 'none';
  crumbEl.textContent = 'Loading…';
  statusEl.textContent = '';

  try{
    const res = await fetch(TREE_API);
    if(!res.ok){
      showError(res.status === 403
        ? "Rate limited by GitHub API — try again in a bit."
        : `Failed to load file list (HTTP ${res.status}).`);
      return;
    }
    const data = await res.json();
    const tree = data.tree || [];

    // Diagnostics: every actual top-level folder name in the repo
    const rootSet = new Set();
    tree.forEach(item => {
      const top = item.path.split('/')[0];
      if(top && item.path.includes('/')) rootSet.add(top);
    });
    rootFolderNames = [...rootSet].sort();

    allImages = tree
      .filter(item => item.type === 'blob' && MEDIA_EXT.test(item.path))
      .filter(item => ALLOWED_PREFIXES.some(p => item.path.startsWith(p)))
      .map(item => {
        const parts = item.path.split('/');
        const name = parts[parts.length - 1];
        const folder = parts.slice(0, -1).join('/');
        return { path: item.path, name, folder, isVideo: VIDEO_EXT.test(item.path) };
      });

    // Diagnostic: warn in console if a configured prefix matched nothing
    ALLOWED_PREFIXES.forEach(p => {
      const topName = p.split('/')[0];
      if(!rootFolderNames.includes(topName)){
        console.warn(`Gall.y: configured folder "${topName}" was not found at repo root. Actual root folders:`, rootFolderNames);
      }
    });

    buildFolderTree();
    renderTree();
    loadbar.classList.remove('active');
    applyFilters();
  } catch(err){
    showError("Failed to load — check your connection.");
    console.error(err);
  }
}

function showError(msg){
  loadbar.classList.remove('active');
  errorMsg.textContent = msg;
  errorBox.classList.add('active');
  crumbEl.textContent = 'Failed to load';
  grid.innerHTML = '';
  emptyEl.style.display = 'none';
}
retryBtn.addEventListener('click', init);

function buildFolderTree(){
  folderTree = {};
  allImages.forEach(img => {
    const parts = img.folder.split('/');
    let node = folderTree;
    let pathAcc = [];
    parts.forEach(part => {
      pathAcc.push(part);
      if(!node[part]) node[part] = { name: part, path: pathAcc.join('/'), count: 0, children: {} };
      node[part].count++;
      node = node[part].children;
    });
  });
}

function pinnedCount(){
  return allImages.filter(img => PINNED_PATHS.includes(img.folder)).length;
}

// alphabetical, matching GitHub's own default tree ordering
function sortedValues(obj){
  return Object.values(obj).sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true}));
}

function renderTree(){
  treeEl.innerHTML = '';

  treeEl.appendChild(makeSimpleRow("All", "", allImages.length, 'all'));

  const pCount = pinnedCount();
  if(pCount > 0){
    const divider = document.createElement('div');
    divider.className = 'tdivider';
    treeEl.appendChild(divider);

    const favLabel = document.createElement('div');
    favLabel.className = 'tsection-label';
    favLabel.textContent = 'Favorites';
    treeEl.appendChild(favLabel);

    PINNED_PATHS.forEach(path => {
      const count = allImages.filter(img => img.folder === path).length;
      if(count > 0){
        treeEl.appendChild(makeSimpleRow(path, path, count, 'star'));
      }
    });
  }

  const divider2 = document.createElement('div');
  divider2.className = 'tdivider';
  treeEl.appendChild(divider2);

  const browseLabel = document.createElement('div');
  browseLabel.className = 'tsection-label';
  browseLabel.textContent = 'Browse';
  treeEl.appendChild(browseLabel);

  sortedValues(folderTree).forEach(node => treeEl.appendChild(renderNode(node)));
}

function makeSimpleRow(label, path, count, iconType){
  const row = document.createElement('div');
  row.className = 'trow' + (selectedFolder === path ? ' selected' : '');
  row.dataset.path = path;

  const spacer = document.createElement('span');
  spacer.className = 'chev-spacer';
  row.appendChild(spacer);

  const main = document.createElement('div');
  main.className = 'row-main';

  const icon = document.createElement('span');
  icon.className = 'folder-icon';
  icon.innerHTML = FOLDER_SVG;
  main.appendChild(icon);

  const labelEl = document.createElement('span');
  labelEl.className = 'label';
  labelEl.textContent = label;
  main.appendChild(labelEl);

  const countEl = document.createElement('span');
  countEl.className = 'count';
  countEl.textContent = count;
  main.appendChild(countEl);

  main.addEventListener('click', () => selectFolder(path));
  row.appendChild(main);
  return row;
}

function renderNode(node){
  const wrap = document.createElement('div');
  const hasChildren = Object.keys(node.children).length > 0;
  wrap.className = 'tnode';

  const isOpen = openFolders.has(node.path);

  const row = document.createElement('div');
  row.className = 'trow' + (selectedFolder === node.path ? ' selected' : '') + (isOpen ? ' open' : '');
  row.dataset.path = node.path;

  if(hasChildren){
    const chevBtn = document.createElement('button');
    chevBtn.className = 'chev-btn';
    chevBtn.setAttribute('aria-label', 'Toggle');
    chevBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M3 1L7 5L3 9" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    chevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFolder(node.path);
    });
    row.appendChild(chevBtn);
  } else {
    const spacer = document.createElement('span');
    spacer.className = 'chev-spacer';
    row.appendChild(spacer);
  }

  const main = document.createElement('div');
  main.className = 'row-main';

  const icon = document.createElement('span');
  icon.className = 'folder-icon';
  icon.innerHTML = FOLDER_SVG;
  main.appendChild(icon);

  const labelEl = document.createElement('span');
  labelEl.className = 'label';
  labelEl.textContent = node.name;
  main.appendChild(labelEl);

  const countEl = document.createElement('span');
  countEl.className = 'count';
  countEl.textContent = node.count;
  main.appendChild(countEl);

  main.addEventListener('click', () => selectFolder(node.path));
  row.appendChild(main);
  wrap.appendChild(row);

  if(hasChildren){
    const childWrap = document.createElement('div');
    childWrap.className = 'children' + (isOpen ? ' open' : '');
    sortedValues(node.children).forEach(child => childWrap.appendChild(renderNode(child)));
    wrap.appendChild(childWrap);
  }

  return wrap;
}

function toggleFolder(path){
  if(openFolders.has(path)) openFolders.delete(path);
  else openFolders.add(path);
  renderTree();
}

function selectFolder(path){
  selectedFolder = path;
  // auto-expand ancestor chain so the selected item stays visible
  if(path && path !== '__pinned__' && !PINNED_PATHS.includes(path)){
    const parts = path.split('/');
    let acc = [];
    for(let i = 0; i < parts.length - 1; i++){
      acc.push(parts[i]);
      openFolders.add(acc.join('/'));
    }
  }
  renderTree();
  applyFilters();
  closeSidebarMobile();
}

function applyFilters(){
  const q = searchQuery.trim().toLowerCase();
  filtered = allImages.filter(img => {
    if(PINNED_PATHS.includes(selectedFolder)){
      if(img.folder !== selectedFolder) return false;
    } else if(selectedFolder){
      if(!(img.folder === selectedFolder || img.folder.startsWith(selectedFolder + '/'))) return false;
    }
    if(q && !img.path.toLowerCase().includes(q)) return false;
    return true;
  });
  grid.innerHTML = '';
  renderedCount = 0;
  const label = selectedFolder || 'All';
  crumbEl.innerHTML = `<b>${label}</b> — ${filtered.length.toLocaleString()} file${filtered.length===1?'':'s'}`;

  if(filtered.length === 0){
    emptyEl.style.display = 'block';
    if(allImages.length === 0 && rootFolderNames.length > 0){
      emptyEl.innerHTML = `No matching folders found in the repo.<br><span style="font-family:var(--mono);font-size:11.5px;">Root folders present: ${rootFolderNames.join(', ')}</span>`;
    } else {
      emptyEl.textContent = 'No files match.';
    }
  } else {
    emptyEl.style.display = 'none';
  }

  renderNextBatch();
}

function renderNextBatch(){
  const slice = filtered.slice(renderedCount, renderedCount + BATCH);
  if(slice.length === 0) return;

  const fragment = document.createDocumentFragment();
  slice.forEach(img => {
    const cell = document.createElement('div');
    cell.className = 'cell' + (selectedPaths.has(img.path) ? ' selected' : '');

    const check = document.createElement('div');
    check.className = 'select-check';
    check.innerHTML = selectedPaths.has(img.path) ? '✓' : '';
    check.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSelect(img.path, cell, check);
    });
    cell.appendChild(check);

    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';

    const src = RAW_BASE + img.path.split('/').map(encodeURIComponent).join('/');

    if(img.isVideo){
      const vEl = document.createElement('video');
      vEl.src = src;
      vEl.muted = true;
      vEl.playsInline = true;
      vEl.preload = 'metadata';
      vEl.addEventListener('loadeddata', () => vEl.classList.add('loaded'));
      wrap.appendChild(vEl);
      const badge = document.createElement('span');
      badge.className = 'play-badge';
      badge.textContent = '▶ video';
      wrap.appendChild(badge);
    } else {
      const imEl = document.createElement('img');
      imEl.loading = 'lazy';
      imEl.decoding = 'async';
      imEl.src = src;
      imEl.alt = img.name;
      imEl.addEventListener('load', () => imEl.classList.add('loaded'));
      imEl.addEventListener('error', () => { wrap.style.display = 'none'; });
      wrap.appendChild(imEl);
    }

    cell.appendChild(wrap);

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = img.name;
    cell.appendChild(nameEl);

    cell.addEventListener('click', () => {
      if(selectMode){
        toggleSelect(img.path, cell, check);
      } else {
        openLightbox(img);
      }
    });
    fragment.appendChild(cell);
  });
  grid.appendChild(fragment);
  renderedCount += slice.length;
}

function toggleSelect(path, cell, check){
  if(selectedPaths.has(path)){
    selectedPaths.delete(path);
    cell.classList.remove('selected');
    check.innerHTML = '';
  } else {
    selectedPaths.add(path);
    cell.classList.add('selected');
    check.innerHTML = '✓';
  }
  updateDownloadBar();
}

function updateDownloadBar(){
  selCountNum.textContent = selectedPaths.size;
  downloadBar.classList.toggle('active', selectMode && selectedPaths.size > 0);
}

const observer = new IntersectionObserver(entries => {
  if(entries[0].isIntersecting) renderNextBatch();
}, { rootMargin: '400px' });
observer.observe(sentinel);

// ---------- Lightbox ----------
const lightbox = document.getElementById('lightbox');
const lbMedia = document.getElementById('lb-media');
const lbPath = document.getElementById('lb-path');
const lbOpen = document.getElementById('lb-open');
const lbGithub = document.getElementById('lb-github');
const lbCopy = document.getElementById('lb-copy');
const lbSize = document.getElementById('lb-size');
const lbDate = document.getElementById('lb-date');
const lbDims = document.getElementById('lb-dims');
const lbDownload = document.getElementById('lb-download');
let currentLightboxImg = null;

function formatBytes(bytes){
  if(bytes == null) return '—';
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(2) + ' MB';
}

function formatDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

async function openLightbox(img){
  currentLightboxImg = img;
  const rawUrl = RAW_BASE + img.path.split('/').map(encodeURIComponent).join('/');
  lbMedia.innerHTML = '';
  lbDims.textContent = '…';

  if(img.isVideo){
    const vEl = document.createElement('video');
    vEl.src = rawUrl;
    vEl.controls = true;
    vEl.autoplay = true;
    vEl.playsInline = true;
    vEl.addEventListener('loadedmetadata', () => {
      lbDims.textContent = `${vEl.videoWidth}×${vEl.videoHeight}`;
    });
    lbMedia.appendChild(vEl);
  } else {
    const imEl = document.createElement('img');
    imEl.src = rawUrl;
    imEl.alt = img.name;
    imEl.addEventListener('load', () => {
      lbDims.textContent = `${imEl.naturalWidth}×${imEl.naturalHeight}`;
    });
    lbMedia.appendChild(imEl);
  }

  lbPath.textContent = img.path;
  lbOpen.href = rawUrl;
  lbGithub.href = BLOB_BASE + img.path.split('/').map(encodeURIComponent).join('/');
  lbSize.textContent = '…';
  lbDate.textContent = dateCache.has(img.path) && dateCache.get(img.path) ? formatDate(dateCache.get(img.path)) : '…';
  lightbox.classList.add('open');
  document.body.classList.add('modal-open');

  fetch(CONTENTS_API(img.path))
    .then(r => r.ok ? r.json() : null)
    .then(data => { lbSize.textContent = data && data.size != null ? formatBytes(data.size) : 'unavailable'; })
    .catch(() => { lbSize.textContent = 'unavailable'; });

  if(!dateCache.has(img.path)){
    fetch(COMMITS_API(img.path))
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        const date = (data && data[0] && data[0].commit && data[0].commit.committer)
          ? data[0].commit.committer.date : null;
        dateCache.set(img.path, date);
        lbDate.textContent = date ? formatDate(date) : 'unavailable';
      })
      .catch(() => { lbDate.textContent = 'unavailable'; });
  } else {
    const cached = dateCache.get(img.path);
    lbDate.textContent = cached ? formatDate(cached) : 'unavailable';
  }
}

function closeLightbox(){
  lightbox.classList.remove('open');
  document.body.classList.remove('modal-open');
  lbMedia.innerHTML = '';
}
lbDownload.addEventListener('click', async () => {
  if(!currentLightboxImg) return;
  const confirmed = await showConfirm(`Save "${currentLightboxImg.name}" to your device?`, 'Download file');
  if(!confirmed) return;
  lbDownload.disabled = true;
  const original = lbDownload.textContent;
  lbDownload.textContent = 'Downloading…';
  try{
    await downloadSingle(currentLightboxImg);
  } catch(e){
    console.error(e);
  }
  lbDownload.textContent = original;
  lbDownload.disabled = false;
});

document.getElementById('lb-close').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeLightbox(); });
lbCopy.addEventListener('click', () => {
  navigator.clipboard.writeText(lbPath.textContent);
  lbCopy.textContent = 'Copied!';
  setTimeout(() => lbCopy.textContent = 'Copy path', 1200);
});

// Search
let debounceTimer;
sbSearch.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    searchQuery = sbSearch.value;
    applyFilters();
  }, 200);
});

// ---------- Select mode ----------
selectToggle.addEventListener('click', () => {
  selectMode = !selectMode;
  document.body.classList.toggle('select-mode', selectMode);
  selectToggle.classList.toggle('active', selectMode);
  selectToggle.textContent = selectMode ? 'Cancel select' : 'Select';
  if(!selectMode){
    selectedPaths.clear();
  }
  updateDownloadBar();
  applyFilters();
});

clearSelectionBtn.addEventListener('click', () => {
  selectedPaths.clear();
  updateDownloadBar();
  applyFilters();
});

async function downloadSingle(img){
  const rawUrl = RAW_BASE + img.path.split('/').map(encodeURIComponent).join('/');
  const res = await fetch(rawUrl);
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = img.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function buildAndDownloadZip(imgList, zipFilename, btn, disableAlso){
  if(typeof JSZip === 'undefined'){
    alert('Zip library failed to load — check your connection and try again.');
    return;
  }

  btn.disabled = true;
  if(disableAlso) disableAlso.forEach(b => b.disabled = true);
  const originalText = btn.textContent;
  const zip = new JSZip();
  let failCount = 0;

  for(let i = 0; i < imgList.length; i++){
    const img = imgList[i];
    btn.textContent = `Zipping ${i+1}/${imgList.length}…`;
    try{
      const rawUrl = RAW_BASE + img.path.split('/').map(encodeURIComponent).join('/');
      const res = await fetch(rawUrl);
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const blob = await res.blob();
      // keep folder structure inside the zip so same-named files from different
      // characters/folders don't overwrite each other
      zip.file(img.path, blob);
    } catch(e){
      failCount++;
      console.error('Failed to fetch for zip:', img.path, e);
    }
  }

  btn.textContent = 'Compressing…';
  try{
    const content = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } },
      (metadata) => {
        btn.textContent = `Compressing… ${Math.round(metadata.percent)}%`;
      });
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    a.href = url;
    a.download = zipFilename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch(e){
    console.error(e);
    alert('Failed to build the zip file.');
  }

  if(failCount > 0){
    alert(`${failCount} file(s) failed to download and were left out of the zip.`);
  }

  btn.textContent = originalText;
  btn.disabled = false;
  if(disableAlso) disableAlso.forEach(b => b.disabled = false);
}

downloadSelectedBtn.addEventListener('click', async () => {
  const paths = [...selectedPaths];
  if(paths.length === 0) return;

  const confirmed = await showConfirm(`Package ${paths.length} selected file${paths.length===1?'':'s'} into one .zip and save it to your device?`, 'Download selection');
  if(!confirmed) return;

  const imgList = paths.map(p => allImages.find(x => x.path === p)).filter(Boolean);
  await buildAndDownloadZip(imgList, `gally-export-${Date.now()}.zip`, downloadSelectedBtn, [clearSelectionBtn]);
});

downloadFolderBtn.addEventListener('click', async () => {
  const imgList = filtered.slice();
  if(imgList.length === 0) return;

  const folderLabel = selectedFolder || 'All';
  const sizeNote = imgList.length > 250
    ? ` Since that's a large batch, it may take a few minutes and use noticeable memory while it builds.`
    : '';
  const confirmed = await showConfirm(
    `This will package all ${imgList.length.toLocaleString()} file${imgList.length===1?'':'s'} in "${folderLabel}" into one .zip file to save to your device.${sizeNote}`,
    'Download this folder'
  );
  if(!confirmed) return;

  const safeName = folderLabel.replace(/[^a-z0-9_-]+/gi, '_');
  await buildAndDownloadZip(imgList, `gally-${safeName}-${Date.now()}.zip`, downloadFolderBtn, [selectToggle]);
});

// ---------- Custom confirm modal ----------
const confirmModal = document.getElementById('confirm-modal');
const confirmTitle = document.getElementById('confirm-title');
const confirmMsg = document.getElementById('confirm-msg');
const confirmOk = document.getElementById('confirm-ok');
const confirmCancel = document.getElementById('confirm-cancel');
let confirmResolver = null;

function showConfirm(message, title){
  confirmTitle.textContent = title || 'Confirm';
  confirmMsg.textContent = message;
  confirmModal.classList.add('open');
  return new Promise(resolve => { confirmResolver = resolve; });
}
function resolveConfirm(val){
  confirmModal.classList.remove('open');
  if(confirmResolver){ confirmResolver(val); confirmResolver = null; }
}
confirmOk.addEventListener('click', () => resolveConfirm(true));
confirmCancel.addEventListener('click', () => resolveConfirm(false));
confirmModal.addEventListener('click', e => { if(e.target === confirmModal) resolveConfirm(false); });

// Mobile sidebar toggle
function openSidebarMobile(){ sidebar.classList.add('open'); sbOverlay.classList.add('open'); }
function closeSidebarMobile(){
  if(window.innerWidth <= 860){
    sidebar.classList.remove('open'); sbOverlay.classList.remove('open');
  }
}
sbToggle.addEventListener('click', () => {
  sidebar.classList.contains('open') ? closeSidebarMobile() : openSidebarMobile();
});
sbOverlay.addEventListener('click', closeSidebarMobile);

init();
